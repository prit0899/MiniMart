    <text x="45" y="26" text-anchor="middle" fill="#333" font-size="10">CARRY</text>
    <text x="90" y="26" text-anchor="middle" fill="#333" font-size="10">CROP</text>
  </g>

  <!-- Processing strip Z=28-38 -->
  <g transform="translate(360,450)">
    <rect x="0"  y="0" width="70" height="30" fill="#c9c9cf" stroke="#6a6a76" stroke-width="1"/>
    <rect x="80" y="0" width="70" height="30" fill="#c9c9cf" stroke="#6a6a76" stroke-width="1"/>
    <rect x="160" y="0" width="70" height="30" fill="#c9c9cf" stroke="#6a6a76" stroke-width="1"/>
    <text x="35"  y="18" text-anchor="middle" fill="#111" font-size="10">Blender</text>
    <text x="115" y="18" text-anchor="middle" fill="#111" font-size="10">Oven</text>
    <text x="195" y="18" text-anchor="middle" fill="#111" font-size="10">Mill</text>
  </g>

  <!-- Supermarket furniture placeholders -->
  <g fill="#c88d5f">
    <rect x="380" y="260" width="34" height="24"/> <rect x="440" y="260" width="34" height="24"/>
    <rect x="500" y="260" width="34" height="24"/> <rect x="560" y="260" width="34" height="24"/>
    <rect x="380" y="320" width="34" height="24"/> <rect x="440" y="320" width="34" height="24"/>
    <rect x="500" y="320" width="34" height="24"/> <rect x="560" y="320" width="34" height="24"/>
  </g>
  <!-- Registers on the east edge of beige -->
  <g fill="#7bd7d1">
    <rect x="600" y="270" width="30" height="14"/>
    <rect x="600" y="300" width="30" height="14"/>
  </g>
  <!-- Bakery displays on pink floor -->
  <g fill="#c88d5f">
    <rect x="680" y="260" width="40" height="20"/>
    <rect x="750" y="260" width="40" height="20"/>
    <rect x="680" y="320" width="40" height="20"/>
    <rect x="750" y="320" width="40" height="20"/>
  </g>

  <!-- Perimeter trees ring (X ±50, Z 0-82) -->
  <g fill="#3d5c26">
    <circle cx="55"  cy="55" r="8"/> <circle cx="145" cy="55" r="8"/> <circle cx="235" cy="55" r="8"/>
    <circle cx="325" cy="55" r="8"/> <circle cx="415" cy="55" r="8"/> <circle cx="505" cy="55" r="8"/>
    <circle cx="595" cy="55" r="8"/> <circle cx="685" cy="55" r="8"/> <circle cx="775" cy="55" r="8"/>
    <circle cx="865" cy="55" r="8"/> <circle cx="925" cy="55" r="8"/>
    <circle cx="55"  cy="770" r="8"/> <circle cx="145" cy="770" r="8"/> <circle cx="235" cy="770" r="8"/>
    <circle cx="325" cy="770" r="8"/> <circle cx="925" cy="770" r="8"/>
    <circle cx="55" cy="150" r="8"/> <circle cx="55" cy="240" r="8"/> <circle cx="55" cy="330" r="8"/>
    <circle cx="55" cy="420" r="8"/> <circle cx="55" cy="510" r="8"/> <circle cx="55" cy="600" r="8"/> <circle cx="55" cy="690" r="8"/>
    <circle cx="925" cy="150" r="8"/> <circle cx="925" cy="240" r="8"/> <circle cx="925" cy="330" r="8"/>
    <circle cx="925" cy="420" r="8"/> <circle cx="925" cy="510" r="8"/> <circle cx="925" cy="600" r="8"/> <circle cx="925" cy="690" r="8"/>
  </g>

  <!-- Labels -->
  <g fill="#fff" font-size="12" font-weight="bold" opacity="0.85">
    <text x="490" y="30" text-anchor="middle">Broad asphalt road (100×16, Z=62-78) — Batch 21</text>
    <text x="150" y="700" text-anchor="middle">LIVESTOCK WEST</text>
    <text x="420" y="700" text-anchor="middle">SUPPLY (upgrade pads)</text>
    <text x="700" y="700" text-anchor="middle">AGRICULTURE EAST</text>
    <text x="490" y="418" text-anchor="middle" fill="#333">Processing Strip</text>
    <text x="490" y="250" text-anchor="middle" fill="#333">Cashier / Central / Bakery-Café</text>
    <text x="322" y="290" text-anchor="end" fill="#e94f4f" font-size="10">Striped gate + van parking (Batch 23)</text>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!-- Farm-side isometric mock derived from SceneBootstrapper coords + Batch 19/20 costume code. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="-apple-system, sans-serif" font-size="12">
  <rect width="980" height="620" fill="#8ec765"/>
  <!-- store north edge (top of frame) -->
  <rect x="0" y="0" width="980" height="120" fill="#e6d3a2"/>
  <rect x="640" y="0" width="340" height="120" fill="#f5d4e7"/>
  <line x1="0" y1="120" x2="980" y2="120" stroke="#c8c2a7" stroke-width="4"/>

  <!-- HUD: purple gear top-left -->
  <rect x="14" y="14" width="42" height="42" rx="8" fill="#8b5bc9"/>
  <circle cx="35" cy="35" r="10" fill="none" stroke="#fff" stroke-width="3"/>
  <!-- Phone-order timer chip Batch 23 -->
  <rect x="14" y="140" width="60" height="42" rx="8" fill="#fabe4a"/>
  <rect x="30" y="146" width="28" height="12" rx="3" fill="#4c4c52"/>
  <text x="44" y="176" text-anchor="middle" font-size="10" font-weight="bold">08m 09s</text>
  <circle cx="70" cy="146" r="6" fill="#dc3232"/>
  <!-- Cash pill top-right -->
  <rect x="820" y="18" width="140" height="36" rx="18" fill="#f0f1eb" opacity="0.95"/>
  <rect x="828" y="26" width="24" height="18" rx="4" fill="#48b854"/>
  <text x="945" y="43" text-anchor="end" font-weight="bold" fill="#191919">$524</text>

  <!-- Hen coop: dirt patch + eggs + chicken -->
  <g transform="translate(220,340)">
    <ellipse cx="0" cy="0" rx="80" ry="46" fill="#d9a559"/>
    <ellipse cx="0" cy="0" rx="60" ry="34" fill="#a97a3a"/>
    <ellipse cx="-30" cy="-6" rx="12" ry="8" fill="#fffbe6"/>
    <ellipse cx="-10" cy="4" rx="12" ry="8" fill="#fffbe6"/>
    <ellipse cx="12" cy="-4" rx="12" ry="8" fill="#fffbe6"/>
    <ellipse cx="30" cy="4" rx="12" ry="8" fill="#fffbe6"/>
    <!-- chicken w/ red comb -->
    <ellipse cx="0" cy="-14" rx="16" ry="10" fill="#fff"/>
    <ellipse cx="0" cy="-24" rx="8" ry="6" fill="#e94f4f"/>
  </g>
  <text x="220" y="404" text-anchor="middle" fill="#111" font-weight="bold">6/8</text>
  <text x="220" y="418" text-anchor="middle" fill="#e94f4f" font-size="10">🍅 badge (Batch 22 persistent n/m)</text>

  <!-- Farmer w/ straw hat next to wheat field, Batch 19 costume -->
  <g transform="translate(600,300)">
    <ellipse cx="0" cy="30" rx="12" ry="4" fill="#333" opacity="0.3"/>
    <rect x="-10" y="4" width="20" height="28" rx="6" fill="#7a4a25"/>  <!-- brown apron -->
    <rect x="-4"  y="4" width="8"  height="6"  fill="#c19a6b"/>          <!-- shoulder strap -->
    <circle cx="0" cy="-4" r="10" fill="#f0c090"/>                       <!-- head -->
    <!-- straw hat -->
    <ellipse cx="0" cy="-13" rx="20" ry="4" fill="#e8c26a"/>
    <ellipse cx="0" cy="-16" rx="10" ry="5" fill="#e8c26a"/>
    <!-- brown boots -->
    <rect x="-8" y="30" width="6" height="6" fill="#5a3b18"/>
    <rect x="2"  y="30" width="6" height="6" fill="#5a3b18"/>
  </g>

  <!-- Wheat field -->
  <g transform="translate(660,340)">
    <rect x="0" y="0" width="180" height="90" fill="#6b3e1f"/>
    <g fill="#e8c74e">
      <rect x="10"  y="10" width="12" height="20"/><rect x="40" y="10" width="12" height="20"/><rect x="70" y="10" width="12" height="20"/><rect x="100" y="10" width="12" height="20"/><rect x="130" y="10" width="12" height="20"/>
      <rect x="10"  y="40" width="12" height="20"/><rect x="40" y="40" width="12" height="20"/><rect x="70" y="40" width="12" height="20"/><rect x="100" y="40" width="12" height="20"/><rect x="130" y="40" width="12" height="20"/>
      <rect x="10"  y="70" width="12" height="20"/><rect x="40" y="70" width="12" height="20"/><rect x="70" y="70" width="12" height="20"/><rect x="100" y="70" width="12" height="20"/><rect x="130" y="70" width="12" height="20"/>
    </g>
  </g>

  <!-- Tomato plants on raised wooden crates -->
  <g transform="translate(350,470)">
    <rect x="0" y="0" width="200" height="12" fill="#7a4a25"/>
    <g>
      <circle cx="20" cy="-8" r="8" fill="#e94f4f"/><circle cx="60" cy="-8" r="8" fill="#e94f4f"/><circle cx="100" cy="-8" r="8" fill="#e94f4f"/><circle cx="140" cy="-8" r="8" fill="#e94f4f"/><circle cx="180" cy="-8" r="8" fill="#e94f4f"/>
    </g>
    <g fill="#3a7a2b">
      <line x1="20" y1="-8" x2="20" y2="0" stroke="#3a7a2b" stroke-width="2"/>
      <line x1="60" y1="-8" x2="60" y2="0" stroke="#3a7a2b" stroke-width="2"/>
      <line x1="100" y1="-8" x2="100" y2="0" stroke="#3a7a2b" stroke-width="2"/>
      <line x1="140" y1="-8" x2="140" y2="0" stroke="#3a7a2b" stroke-width="2"/>
      <line x1="180" y1="-8" x2="180" y2="0" stroke="#3a7a2b" stroke-width="2"/>
    </g>
  </g>

  <!-- Player (blue w/ white ballcap) -->
  <g transform="translate(480,540)">
    <rect x="-10" y="0" width="20" height="28" rx="6" fill="#3d95d0"/>
    <circle cx="0" cy="-8" r="10" fill="#f0c090"/>
    <path d="M -10 -14 L 10 -14 L 12 -10 L -12 -10 Z" fill="#fff"/> <!-- ballcap -->
    <rect x="-14" y="-11" width="6" height="4" fill="#fff"/>
  </g>

  <!-- Joystick -->
  <circle cx="490" cy="580" r="36" fill="#fff" opacity="0.85"/>
  <circle cx="490" cy="580" r="20" fill="#e6e6e6"/>
  <g fill="#666">
    <polygon points="490,548 494,556 486,556"/> <polygon points="490,612 494,604 486,604"/>
    <polygon points="458,580 466,576 466,584"/> <polygon points="522,580 514,576 514,584"/>
  </g>

  <text x="490" y="600" text-anchor="middle" font-size="10" fill="#333">Batch 19: role costumes  |  Batch 22: n/m badge  |  Batch 23: HUD chip</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!-- Mall interior mock derived from ShopShelf + Batch 20/22 features. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="-apple-system, sans-serif" font-size="12">
  <rect width="980" height="620" fill="#e6d3a2"/>
  <rect x="640" y="0" width="340" height="620" fill="#f5d4e7"/>
  <rect x="0" y="0" width="980" height="24" fill="#c8c2a7"/>

  <!-- HUD chrome -->
  <rect x="14" y="14" width="42" height="42" rx="8" fill="#8b5bc9"/>
  <circle cx="35" cy="35" r="10" fill="none" stroke="#fff" stroke-width="3"/>
  <rect x="820" y="18" width="140" height="36" rx="18" fill="#f0f1eb"/>
  <rect x="828" y="26" width="24" height="18" rx="4" fill="#48b854"/>
  <text x="945" y="43" text-anchor="end" font-weight="bold">$1834</text>

  <!-- Shelves w/ MAX or n/m badges + yellow restock arrows (Batch 20/22) -->
  <g>
    <!-- shelf 1 (MAX) tomato -->
    <g transform="translate(120,220)">
      <rect x="0" y="0" width="80" height="40" fill="#c88d5f"/>
      <circle cx="15" cy="-4" r="8" fill="#e94f4f"/><circle cx="35" cy="-4" r="8" fill="#e94f4f"/>
      <circle cx="55" cy="-4" r="8" fill="#e94f4f"/><circle cx="20" cy="-18" r="8" fill="#e94f4f"/>
      <rect x="24" y="-60" width="32" height="18" rx="4" fill="#333"/>
      <text x="40" y="-46" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">MAX</text>
    </g>
    <!-- shelf 2 (2/8) -> arrow shown -->
    <g transform="translate(240,220)">
      <rect x="0" y="0" width="80" height="40" fill="#c88d5f"/>
      <ellipse cx="20" cy="-4" rx="9" ry="6" fill="#fff"/><ellipse cx="40" cy="-4" rx="9" ry="6" fill="#fff"/>
      <rect x="24" y="-60" width="32" height="18" rx="4" fill="#333"/>
      <text x="40" y="-46" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">2/8</text>
      <!-- yellow restock arrow (Batch 20) -->
      <g transform="translate(40,-90)">
        <rect x="-6" y="-20" width="12" height="28" fill="#ffd633"/>
        <polygon points="-14,8 14,8 0,26" fill="#ffd633"/>
      </g>
    </g>
    <!-- shelf 3 (5/8) -->
    <g transform="translate(360,220)">
      <rect x="0" y="0" width="80" height="40" fill="#c88d5f"/>
      <rect x="8"  y="-8" width="14" height="14" fill="#a8d67d"/>
      <rect x="24" y="-8" width="14" height="14" fill="#a8d67d"/>
      <rect x="40" y="-8" width="14" height="14" fill="#a8d67d"/>
      <rect x="24" y="-60" width="32" height="18" rx="4" fill="#333"/>
      <text x="40" y="-46" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">5/8</text>
    </g>
    <!-- shelf 4 (0/8) -> arrow -->
    <g transform="translate(480,220)">
      <rect x="0" y="0" width="80" height="40" fill="#c88d5f"/>
      <rect x="24" y="-60" width="32" height="18" rx="4" fill="#333"/>
      <text x="40" y="-46" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">0/8</text>
      <g transform="translate(40,-90)">
        <rect x="-6" y="-20" width="12" height="28" fill="#ffd633"/>
        <polygon points="-14,8 14,8 0,26" fill="#ffd633"/>
      </g>
    </g>
  </g>

  <!-- Shoppers w/ shopping carts (Batch 20) -->
  <g transform="translate(220,400)">
    <rect x="-10" y="0" width="20" height="26" rx="5" fill="#c264c2"/>
    <circle cx="0" cy="-6" r="9" fill="#f0c090"/>
    <ellipse cx="0" cy="-14" rx="10" ry="5" fill="#4a2d17"/>
    <!-- cart -->
    <g transform="translate(20,10)">
      <rect x="-8" y="-8" width="24" height="16" fill="#d1d1d6"/>
      <rect x="-6" y="-12" width="20" height="4" fill="#e63c3c"/>
      <circle cx="-4" cy="10" r="3" fill="#111"/><circle cx="12" cy="10" r="3" fill="#111"/>
    </g>
  </g>
  <g transform="translate(360,400)">
    <rect x="-10" y="0" width="20" height="26" rx="5" fill="#e0aa2e"/>
    <circle cx="0" cy="-6" r="9" fill="#f0c090"/>
    <ellipse cx="0" cy="-14" rx="10" ry="5" fill="#f5d76e"/> <!-- blonde -->
    <g transform="translate(20,10)">
      <rect x="-8" y="-8" width="24" height="16" fill="#d1d1d6"/>
      <rect x="-6" y="-12" width="20" height="4" fill="#e63c3c"/>
      <circle cx="-4" cy="10" r="3" fill="#111"/><circle cx="12" cy="10" r="3" fill="#111"/>
    </g>
    <!-- thought bubble showing item -->
    <rect x="-30" y="-38" width="40" height="20" rx="6" fill="#fff"/>
    <circle cx="15" cy="-30" r="6" fill="#e94f4f"/>
    <text x="-4" y="-24" font-size="11" font-weight="bold">0/3</text>
  </g>

  <!-- Chef with white toque + apron next to bakery machine -->
  <g transform="translate(720,300)">
    <rect x="-10" y="0" width="20" height="26" rx="5" fill="#dc8fb6"/>
    <rect x="-10" y="8" width="20" height="14" fill="#fff"/>  <!-- apron panel -->
    <circle cx="0" cy="-6" r="9" fill="#f0c090"/>
    <rect x="-9" y="-22" width="18" height="10" rx="3" fill="#fff"/>
    <ellipse cx="0" cy="-24" rx="8" ry="4" fill="#fff"/>
  </g>

  <!-- Red dustbin -->
  <g transform="translate(600,120)">
    <rect x="0" y="0" width="30" height="26" fill="#e63c3c"/>
    <rect x="0" y="0" width="30" height="6" fill="#111"/>
  </g>
  <!-- Blue fridge with glass doors -->
  <g transform="translate(760,80)">
    <rect x="0" y="0" width="90" height="120" fill="#2a94c2"/>
    <rect x="6" y="10" width="34" height="100" fill="#e3f2fb" opacity="0.85"/>
    <rect x="50" y="10" width="34" height="100" fill="#e3f2fb" opacity="0.85"/>
  </g>

  <text x="490" y="600" text-anchor="middle" fill="#333" font-size="11">Batch 20: 15/15 shelves have RestockArrow (10 active on low-stock); 8/8 shoppers push ShoppingCart. Batch 22: n/m badges.</text>
</svg>
